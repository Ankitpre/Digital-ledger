<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Ledger / खाता</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            .print-padding { padding: 0 !important; }
            body { background: white !important; font-size: 12px; }
            input { border: none !important; background: transparent !important; }
            .shadow-lg { box-shadow: none !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8 print-padding">

    <div class="max-w-5xl mx-auto bg-white p-6 rounded-xl shadow-lg border border-slate-200" id="ledger-content">
        
        <div class="border-b-2 border-slate-800 pb-4 mb-6">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-3xl font-bold tracking-tight text-slate-900">LEDGER / खाता</h1>
                    <p class="text-sm text-slate-500 font-medium">Digital Accounting Record</p>
                </div>
                <div class="text-right">
                    <label class="block text-xs font-semibold text-slate-500">Page / पृष्ठ</label>
                    <input type="text" value="107" class="text-right font-bold text-lg w-20 border rounded px-1 text-slate-700">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500">Account Name / नाम खाता</label>
                    <input type="text" value="शिवचरण सिंह / गंगा राम" class="w-full font-semibold text-slate-800 border-b border-slate-300 focus:outline-none focus:border-blue-500 py-1">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500">Month & Year / माह और वर्ष</label>
                    <input type="text" value="अगस्त और सितम्बर - 2026" class="w-full font-semibold text-slate-800 border-b border-slate-300 focus:outline-none focus:border-blue-500 py-1">
                </div>
            </div>
        </div>

        <div class="flex justify-between items-center mb-4 no-print">
            <button onclick="addRow()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition">
                + Add Row (नई प्रविष्टि)
            </button>
            <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2 rounded-lg text-sm transition shadow">
                🖨️ Export PDF / Print
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full border-collapse border border-slate-300 text-left text-sm" id="ledgerTable">
                <thead>
                    <tr class="bg-slate-800 text-white text-xs uppercase">
                        <th class="border border-slate-600 p-2 text-center w-24">Date<br><span class="text-[10px] font-normal">तिथि</span></th>
                        <th class="border border-slate-600 p-2">Particulars<br><span class="text-[10px] font-normal">विवरण</span></th>
                        <th class="border border-slate-600 p-2 text-center w-20">C.B. Folio<br><span class="text-[10px] font-normal">पृष्ठ</span></th>
                        <th class="border border-slate-600 p-2 text-right w-28">Debit (नाम)<br><span class="text-[10px] font-normal">₹</span></th>
                        <th class="border border-slate-600 p-2 text-right w-28">Credit (जमा)<br><span class="text-[10px] font-normal">₹</span></th>
                        <th class="border border-slate-600 p-2 w-48">Remarks / Balance<br><span class="text-[10px] font-normal">शेष / टिप्पणी</span></th>
                        <th class="border border-slate-600 p-2 text-center w-12 no-print">Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td class="border border-slate-300 p-1"><input type="text" value="01/08/26" class="w-full text-center"></td>
                        <td class="border border-slate-300 p-1"><input type="text" value="गंगा राम गौरा" class="w-full"></td>
                        <td class="border border-slate-300 p-1"><input type="text" value="-" class="w-full text-center"></td>
                        <td class="border border-slate-300 p-1"><input type="number" value="" oninput="calculateTotals()" class="w-full text-right debit-input"></td>
                        <td class="border border-slate-300 p-1"><input type="number" value="50000" oninput="calculateTotals()" class="w-full text-right credit-input"></td>
                        <td class="border border-slate-300 p-1"><input type="text" value="जीरा बेलाप्पा" class="w-full"></td>
                        <td class="border border-slate-300 p-1 text-center no-print"><button onclick="deleteRow(this)" class="text-red-500 font-bold hover:text-red-700">✕</button></td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr class="bg-slate-100 font-bold text-slate-900 border-t-2 border-slate-800">
                        <td colspan="3" class="border border-slate-300 p-2 text-right uppercase">Total / कुल:</td>
                        <td class="border border-slate-300 p-2 text-right text-red-600" id="totalDebit">₹ 0</td>
                        <td class="border border-slate-300 p-2 text-right text-emerald-600" id="totalCredit">₹ 0</td>
                        <td colspan="2" class="border border-slate-300 p-2"></td>
                    </tr>
                    <tr class="bg-slate-200 font-bold text-slate-900">
                        <td colspan="3" class="border border-slate-300 p-2 text-right uppercase">Net Balance / कुल बकाया:</td>
                        <td colspan="2" class="border border-slate-300 p-2 text-center text-blue-700 text-base" id="netBalance">₹ 0</td>
                        <td colspan="2" class="border border-slate-300 p-2"></td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="mt-12 flex justify-between items-center text-xs font-semibold text-slate-600 pt-6 border-t">
            <div>Prepared By: __________________</div>
            <div>Authorized Signature: __________________</div>
        </div>
    </div>

    <script>
        function addRow() {
            const tbody = document.getElementById('tableBody');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="border border-slate-300 p-1"><input type="text" placeholder="DD/MM/YY" class="w-full text-center"></td>
                <td class="border border-slate-300 p-1"><input type="text" placeholder="विवरण" class="w-full"></td>
                <td class="border border-slate-300 p-1"><input type="text" placeholder="-" class="w-full text-center"></td>
                <td class="border border-slate-300 p-1"><input type="number" oninput="calculateTotals()" placeholder="0" class="w-full text-right debit-input"></td>
                <td class="border border-slate-300 p-1"><input type="number" oninput="calculateTotals()" placeholder="0" class="w-full text-right credit-input"></td>
                <td class="border border-slate-300 p-1"><input type="text" placeholder="टिप्पणी" class="w-full"></td>
                <td class="border border-slate-300 p-1 text-center no-print"><button onclick="deleteRow(this)" class="text-red-500 font-bold hover:text-red-700">✕</button></td>
            `;
            tbody.appendChild(row);
        }

        function deleteRow(btn) {
            btn.closest('tr').remove();
            calculateTotals();
        }

        function calculateTotals() {
            let totalDebit = 0;
            let totalCredit = 0;

            document.querySelectorAll('.debit-input').forEach(input => {
                totalDebit += parseFloat(input.value) || 0;
            });

            document.querySelectorAll('.credit-input').forEach(input => {
                totalCredit += parseFloat(input.value) || 0;
            });

            const net = totalCredit - totalDebit;

            document.getElementById('totalDebit').innerText = '₹ ' + totalDebit.toLocaleString('en-IN');
            document.getElementById('totalCredit').innerText = '₹ ' + totalCredit.toLocaleString('en-IN');
            document.getElementById('netBalance').innerText = '₹ ' + net.toLocaleString('en-IN') + (net >= 0 ? ' (Credit)' : ' (Debit)');
        }

        window.onload = calculateTotals;
    </script>
</body>
</html>
